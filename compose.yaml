services:
  postgres:
    # Мажорная версия зафиксирована намеренно. На postgres:latest переход на
    # следующий мажор меняет формат каталога данных, и том перестаёт читаться.
    # Повышать мажор нужно осознанно, через pg_upgrade или дамп.
    image: postgres:18
    container_name: questly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
      POSTGRES_SHARED_BUFFERS: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 128MB
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MAINTENANCE_WORK_MEM: 32MB
      POSTGRES_MAX_CONNECTIONS: 20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    volumes:
      - pgdata:/var/lib/postgresql
    # Порт наружу намеренно не публикуется: приложение ходит к базе по
    # внутренней сети compose, по имени postgres. Опубликованный порт Docker
    # обходит ufw (правила уходят в цепочку DOCKER), то есть база оказалась бы
    # открыта в интернет. Подключиться клиентом — через SSH-туннель:
    #
    #   ssh -L 5432:localhost:5432 <пользователь>@<сервер>

  questly:
    container_name: questly-app
    image: shadowkick/questly:latest
    # Инициализатор базы валит старт, если схему применить не удалось,
    # поэтому контейнер должен подниматься заново сам.
    restart: unless-stopped
    labels:
      # Этот контейнер Watchtower обновляет автоматически (сервис watchtower ниже)
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      SERVER_KEY: ${SERVER_KEY}
      HASH_SALT: ${HASH_SALT}
      ISSUER: ${ISSUER}
      AUDIENCE: ${AUDIENCE}
      CONNECTION_STRING: ${CONNECTION_STRING}
      RABBITMQ_HOSTNAME: ${RABBITMQ_HOSTNAME}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Подменяет контейнер приложения, когда workflow "Build and publish" выложил
  # новый образ в Docker Hub. Это и есть деплой: на сервер из CI никто не ходит.
  #
  # ВНИМАНИЕ для локальной работы: поднимается вместе со всем стеком и через
  # минуту заменит локально собранный образ на :latest из реестра. Локально
  # поднимайте только нужные сервисы:
  #
  #   docker compose up -d --build postgres questly
  watchtower:
    image: containrrr/watchtower:latest
    container_name: questly-watchtower
    restart: unless-stopped
    environment:
      # Обновляется только то, что помечено лейблом watchtower.enable=true,
      # то есть questly-app. Postgres под автообновление не попадает намеренно:
      # смена мажорной версии базы требует pg_upgrade, а не подмены контейнера.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Как часто опрашивать реестр, в секундах
      WATCHTOWER_POLL_INTERVAL: "60"
    volumes:
      # Доступ к сокету Docker — это полный контроль над хостом.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
